<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oferta académica - La Litoral</title>
<style>
:root{--purple:#4a2378;--bg:#f7f4fb;--card:#fff;--line:#ddd2ea;--text:#221a2b;--muted:#6e6179}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:18px}
.field{flex:1;min-width:210px}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
input,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px}
.count{font-size:13px;font-weight:700;color:var(--muted);margin:4px 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(74,35,120,.05);cursor:pointer}
.card:hover{transform:translateY(-2px);box-shadow:0 7px 16px rgba(74,35,120,.10)}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;margin:2px 4px 0 0}
.kind{font-size:11px;font-weight:800;color:var(--purple);text-transform:uppercase;letter-spacing:.06em}h3{font-size:17px;line-height:1.25;margin:8px 0 4px}
.meta{font-size:13px;color:var(--muted)}.detail{display:none;margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.detail.active{display:block}.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.close{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}
.recgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.rec{background:#faf8fd;border:1px solid var(--line);border-radius:14px;padding:14px}
.rec h4{margin:0 0 10px;color:var(--purple)}dl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}dt{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
dd{margin:2px 0 0;font-size:13px;font-weight:700}.note{margin-top:14px;border-left:4px solid var(--purple);background:#f3edf9;padding:12px 14px;border-radius:10px;font-size:13px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.grid{grid-template-columns:1fr}.recgrid{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head>
<body><div class="wrap">
<div class="top">
<div class="field"><label>Buscar programa</label><input id="q" type="search" placeholder="Ej. software, mercadeo, administración..."></div>
<div class="field"><label>Tipo</label><select id="type"><option value="all">Todos</option><option>Ciclo propedéutico</option><option>Terminal</option><option>Posgrado</option><option>ETDH</option></select></div>
<div class="field"><label>Nivel</label><select id="level"><option value="all">Todos</option><option>Técnico Profesional</option><option>Tecnología</option><option>Profesional</option><option>Especialización</option><option>Técnico Laboral</option></select></div>
<div class="field"><label>Modalidad</label><select id="mode"><option value="all">Todas</option><option>Presencial</option><option>Virtual</option></select></div>
</div>
<div id="count" class="count"></div><div id="grid" class="grid"></div><div id="detail" class="detail"></div>
</div>

const q=document.getElementById('q'),type=document.getElementById('type'),level=document.getElementById('level'),mode=document.getElementById('mode'),grid=document.getElementById('grid'),count=document.getElementById('count'),detail=document.getElementById('detail');
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function render(){const list=programs.filter(p=>(!q.value||norm(p.name).includes(norm(q.value)))&&(type.value==='all'||p.type===type.value)&&(level.value==='all'||p.level===level.value)&&(mode.value==='all'||p.records.some(r=>r.mode===mode.value)));count.textContent=`${list.length} programa${list.length===1?'':'s'} encontrado${list.length===1?'':'s'}`;grid.innerHTML='';list.forEach(p=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="kind">${p.type}</div><h3>${p.name}</h3><div class="meta">${p.level} · ${p.duration}</div><div style="margin-top:10px">${p.records.map(r=>`<span class="badge">${r.mode}</span>`).join('')}</div>${p.next?`<div class="meta" style="margin-top:10px;font-weight:700">Continúa hacia: ${p.next}</div>`:''}${p.prev?`<div class="meta" style="margin-top:10px;font-weight:700">Articulado desde: ${p.prev}</div>`:''}`;c.onclick=()=>showDetail(p);grid.appendChild(c);});}
function showDetail(p){const rule=p.type==='Ciclo propedéutico'?'Hace parte de una ruta formalmente articulada entre niveles.':p.type==='Terminal'?'Conduce a un título propio. La continuidad posterior puede darse mediante homologación cuando exista afinidad académica, pero no es una ruta propedéutica automática.':p.type==='Posgrado'?'Programa de profundización profesional.':'Programa de Educación para el Trabajo y el Desarrollo Humano.';detail.classList.add('active');detail.innerHTML=`<div class="detail-head"><div><div class="kind">${p.type} · ${p.level}</div><h3 style="font-size:21px">${p.name}</h3><div class="meta">${rule}</div></div><button class="close" onclick="document.getElementById('detail').classList.remove('active')">Cerrar</button></div><div class="recgrid">${p.records.map(r=>`<div class="rec"><h4>${r.mode}</h4><dl><div><dt>SNIES / registro</dt><dd>${r.snies??'No aplica'}</dd></div><div><dt>Resolución</dt><dd>${r.res??'No aplica'}</dd></div><div><dt>Fecha</dt><dd>${r.date??'No aplica'}</dd></div><div><dt>Vencimiento</dt><dd>${r.expiry??'No aplica'}</dd></div><div><dt>Créditos</dt><dd>${r.credits??'No aplica'}</dd></div><div><dt>Duración</dt><dd>${p.duration}</dd></div></dl></div>`).join('')}</div>${p.type!=='ETDH'?'<div class="note">Requisito común de titulación: aprobar el 100 % de los créditos del plan de estudios y cumplir los demás requisitos institucionales correspondientes al nivel de formación.</div>':''}`;detail.scrollIntoView({behavior:'smooth',block:'nearest'});}
[q,type,level,mode].forEach(el=>el.addEventListener(el.tagName==='INPUT'?'input':'change',render));render();
